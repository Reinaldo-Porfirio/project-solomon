[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solomon"
version = "0.2.0"
description = "Windows-first framework for authorized pentesting, read-only local security audits and evidence-based reports."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Reinaldo Porfírio Vieira" }]
keywords = ["security", "pentest", "audit", "bug-bounty", "windows", "diagnostics"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "textual>=8.0,<9",
    "psutil>=7.0,<8",
    "dnspython>=2.8,<3",
]

[project.urls]
Repository = "https://github.com/Reinaldo-Porfirio/project-solomon"

[project.scripts]
solomon = "solomon.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = ["integration: laboratório de rede exclusivamente em loopback"]
